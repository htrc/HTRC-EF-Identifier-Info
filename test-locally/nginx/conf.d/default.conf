# nginx/conf.d/default.conf (Full content - re-type this carefully)
server {
    listen 80;
    server_name localhost; # Use localhost for local testing, or your domain (e.g., your_domain.com)

    rewrite "^/(2025[0-9]{4})(.*)$" /2025$2 permanent; # <--- THIS LINE IS CRITICAL TO TYPE, NOT PASTE

    rewrite "^/(2020[0-9]{4})(.*)$" /2020$2 permanent;

    location / {
        # Proxy all requests to your ef-id-info service
        # 'ef-id-info' is the service name in your docker-compose.yml
        # and '9000' is the port your Play app listens on inside its container.
        proxy_pass http://ef-id-info:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}