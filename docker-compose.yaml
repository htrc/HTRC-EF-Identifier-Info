version: "3"

services:
  ef-id-info:
    image: docker.htrc.illinois.edu/services/ef-identifier-info:1.0
    networks:
      - services
    ports:
      - "127.0.0.1:9001:9000"
    volumes:
      - application.conf:/opt/docker/conf/application.conf:ro
      - logback.xml:/opt/docker/conf/logback.xml:ro
      - data:/data:ro
    restart: always

networks:
  services:
